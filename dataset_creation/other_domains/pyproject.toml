[project]
name = "other-domains"
version = "0.1.0"
description = "Extract books and movies from WDC and match them to Open Library and IMDb."
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
    "ftfy>=6.2.0",
    "loguru>=0.7.3",
    "requests>=2.32.4",
    "tqdm>=4.67.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.1",
    "ruff>=0.12.9",
]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "ruff>=0.12.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shared", "books", "movies"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
addopts = "-vv"
testpaths = ["tests"]
